<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abrir Watchimply</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0b0d12; color: #3ee0c5; font-family: "Segoe UI", sans-serif; }
      main { padding: 48px 24px; text-align: center; }
      a { color: #7aa7ff; }
    </style>
  </head>
  <body>
    <main>
      <p>Limpiando caché y abriendo Watchimply…</p>
      <p><a href="./index.html">Si no entra, pulsa aquí</a></p>
    </main>
    <script>
      (async function () {
        try {
          if (navigator.serviceWorker) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((reg) => reg.unregister()));
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
        } catch (e) {}
        location.replace('./index.html?fresh=1');
      })();
    </script>
  </body>
</html>
